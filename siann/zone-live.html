<h1>칸 구분 시안 — 실제 사이트 창 그대로</h1>
<p class="sub">각 창이 진짜 사이트예요. 스크롤·클릭 다 됩니다. 셋 다 포니테일이 열려 있어요.</p>
<div class="row">
  <div class="col"><h2>1. 가는 선</h2><p>칸 사이 머리카락 선 하나. 배경 전부 흰색, 설명 칸만 연회색.</p><iframe src="../?open=ponytail&zone=line"></iframe></div>
  <div class="col"><h2>2. 배경 띠</h2><p>칸마다 흰 → 연회색 → 흰 → 연회색, 창 끝까지 꽉 찬 띠.</p><iframe src="../?open=ponytail&zone=band"></iframe></div>
  <div class="col"><h2>3. 연회색 타일 (지금)</h2><p>칸마다 둥근 연회색 덩어리. 현재 사이트 상태.</p><iframe src="../?open=ponytail&zone=tint"></iframe></div>
