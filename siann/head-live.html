<title>딸깍 제목 줄 간격 (실제 창)</title>
<style>
  body{margin:0;background:#ececf0;font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#111;padding:24px 16px 40px}
  h1{font-size:22px;margin:0 0 4px}.sub{color:#6e6e73;font-size:14px;margin:0 0 18px}
  .row{display:flex;gap:18px;overflow-x:auto;align-items:flex-start}
  .col{flex:0 0 520px}.col h2{font-size:16px;margin:0 0 4px}.col p{font-size:13px;color:#6e6e73;margin:0 0 10px;min-height:38px}

<h1>제목 줄 간격 시안 — 실제 창 그대로</h1>
<p class="sub">맨 위 다섯 줄(태그 · 이름 · 한 줄 설명 · 별점 · 깃허브 숫자)의 간격만 다릅니다. 셋 다 포니테일.</p>
<div class="row">
  <div class="col"><h2>A. 촘촘</h2><p>줄 사이 3~6px. 한 덩어리로 읽힘. 지금보다 많이 좁음.</p><iframe src="../?open=ponytail&head=a"></iframe></div>
  <div class="col"><h2>B. 중간</h2><p>줄 사이 5~10px. 지금과 촘촘의 중간.</p><iframe src="../?open=ponytail&head=b"></iframe></div>
  <div class="col"><h2>C. 별점·숫자 한 줄</h2><p>별점과 깃허브 숫자를 한 줄에 나란히. 줄이 하나 줄어서 전체가 짧아짐.</p><iframe src="../?open=ponytail&head=c"></iframe></div>
  <div class="col"><h2>(지금)</h2><p>현재 사이트. 비교용.</p><iframe src="../?open=ponytail"></iframe></div>
</div>
